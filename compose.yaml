services:
  php:
    build:
      context: ./docker/php
    container_name: symfony_php
    working_dir: /var/www/html
    volumes:
      - ./symfony:/var/www/html

  caddy:
    image: caddy:2-alpine
    container_name: symfony_caddy
    ports:
      - "80:80"
    volumes:
      - ./symfony:/var/www/html
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - php